<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VOID RUNNER · Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div id="homeContainer">
    <h1>VOID RUNNER</h1>
    <p>Select Game Mode</p>

    <div class="mode-buttons">
      <button id="singlePlayerBtn">Single Player</button>
      <button id="multiPlayerBtn" disabled>Multiplayer</button>
    </div>

    <div id="offlineMessage">⚠ Multiplayer server is offline. Multiplayer disabled.</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const singleBtn = document.getElementById("singlePlayerBtn");
    const multiBtn = document.getElementById("multiPlayerBtn");
    const offlineMessage = document.getElementById("offlineMessage");

    // Single player always works
    singleBtn.onclick = () => {
      localStorage.setItem("gameMode", "single");
      window.location.href = "game.html";
    };

    // Try connecting to the multiplayer server
    const socket = io({ timeout: 3000 });

    socket.on("connect", () => {
      // Multiplayer server online, enable button
      multiBtn.disabled = false;
      multiBtn.title = "Join Multiplayer Lobby";
      offlineMessage.style.display = "none";

      // Disconnect for now, will reconnect in lobby
      socket.disconnect();
    });

    socket.on("connect_error", disableMultiplayer);
    socket.on("connect_timeout", disableMultiplayer);

    function disableMultiplayer() {
      multiBtn.disabled = true;
      multiBtn.title = "Server Offline";
      offlineMessage.style.display = "block";
    }

    // Multiplayer button click
    multiBtn.onclick = () => {
      if (multiBtn.disabled) return;

      localStorage.setItem("gameMode", "multi");
      window.location.href = "lobby.html"; // go to multiplayer lobby
    };
  </script>
</body>
</html>
